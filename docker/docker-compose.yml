services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/var/www
    networks:
      - app-network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    ports:
      - "8080:80" # http://localhost:8080/
    volumes:
      - ..:/var/www
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - app

  db:
    image: mariadb:11.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: restaurant
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # Port SMTP do wysyłania maili przez aplikację
      - "8025:8025" # Panel WWW do podglądu wiadomości
    environment:
      - MP_SMTP_AUTH=user:password
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
#      - MP_UI_AUTH=admin:password
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  dbdata: